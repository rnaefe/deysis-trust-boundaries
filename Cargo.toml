[package]
name = "deysis-trust-boundaries"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "A defensive case study of attendance-system trust boundaries using an incompatible mock protocol."

[lib]
path = "src/lib.rs"

[[bin]]
name = "trust-boundaries-demo"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
p256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[dev-dependencies]
tempfile = "3"
